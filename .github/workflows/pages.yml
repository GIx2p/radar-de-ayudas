name: Publicar web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues solapados; deja terminar el que esté en curso.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar el sitio
        run: |
          mkdir -p _site
          cp -r web/* _site/
          # El catálogo se sirve junto al index para que app.js lo encuentre.
          cp data/ayudas.json _site/ayudas.json
          # Cache-busting: versiona app.js y styles.css con el hash del commit,
          # para que el navegador nunca sirva una versión antigua.
          ver="${GITHUB_SHA::8}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$ver\"|; s|src=\"app.js\"|src=\"app.js?v=$ver\"|" _site/index.html
          echo "Versión de assets: $ver"

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
